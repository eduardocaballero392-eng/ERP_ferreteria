services:
  - type: web
    name: erp-ferreteria-api
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: erp-ferreteria-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: ALLOWED_ORIGINS
        value: https://your-project.vercel.app
